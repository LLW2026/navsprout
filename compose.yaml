name: navsprout
services:
  nav:
    build: .
    image: navsprout:1.0.0
    restart: unless-stopped
    user: "${NAV_UID:-10001}:${NAV_GID:-10001}"
    env_file: .env
    ports:
      - "${NAV_BIND_IP:-0.0.0.0}:${NAV_PORT:-8866}:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
