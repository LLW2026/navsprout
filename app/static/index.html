<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>导航呀</title><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/appearance.css"><script src="/static/appearance.js" defer></script><script src="/static/batch.js" defer></script><script src="/static/icons.js" defer></script><script src="/static/app.js" defer></script></head>
<body>
<div id="background-scene" aria-hidden="true"><img class="background-photo" alt=""><img class="background-photo" alt=""><div class="ambient-light"></div></div>
<div id="login-view" class="login-view" hidden>
  <div class="theme-picker login-theme"><button type="button" class="theme-trigger" data-open-themes aria-label="切换主题" title="切换主题" aria-expanded="false">◐</button><div class="theme-choices" role="group" aria-label="主题" hidden></div></div>
  <form id="login-form" class="login-card"><img class="brand-mark" src="/favicon.ico" width="44" height="44" alt=""><h1>导航呀</h1><label>账号<input name="username" autocomplete="username" required value="admin" maxlength="120"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><p id="login-error" class="error" role="alert"></p><button class="primary" type="submit">登录</button></form>
</div>
<div id="app-view" class="app-shell" hidden>
  <aside class="sidebar"><a href="/" class="brand"><img class="brand-mark" src="/favicon.ico" width="34" height="34" alt="">导航呀</a><div class="sidebar-label">收藏夹</div><nav id="category-nav" aria-label="分类"></nav><button id="manage-categories" class="sidebar-manage">＋ 管理分类</button><div class="sidebar-foot"><span class="status-dot"></span>个人空间</div></aside>
  <main>
    <header class="topbar"><div class="breadcrumb">个人空间 <span>/</span> <strong id="current-title">全部网址</strong></div><div class="top-actions"><div class="theme-picker"><button type="button" class="theme-trigger" data-open-themes aria-label="切换主题" title="切换主题" aria-expanded="false">◐</button><div class="theme-choices" role="group" aria-label="主题" hidden></div></div><div class="background-picker"><button type="button" id="open-background" class="theme-trigger" aria-label="背景设置" title="背景设置" aria-expanded="false">▧</button><div id="background-panel" class="background-panel" hidden><h2>背景</h2><label>图片<select id="background-mode"><option value="theme">随主题</option><option value="daily">每日新图</option></select></label><label id="background-overlay-label" hidden>遮罩<select id="background-overlay"><option value="none">无遮罩</option><option value="soft">半透明遮罩</option></select></label><label id="background-interval-label" hidden>轮播间隔<select id="background-interval"><option value="1">每分钟</option><option value="5">每 5 分钟</option><option value="15">每 15 分钟</option><option value="60">每小时</option><option value="1440">每天</option><option value="0">手动</option></select></label><button type="button" id="next-background" hidden>换一张</button><label class="motion-label"><input type="checkbox" id="background-motion">背景动效</label><p id="background-status" role="status" hidden></p></div></div><button id="add-link" class="primary">＋ 添加网址</button><details class="menu"><summary aria-label="设置" title="设置">•••</summary><div class="menu-panel"><button id="sort-links">全部按名称排序</button><button id="export">导出数据</button><button id="import">导入数据</button><button id="mobile-categories">管理分类</button><button id="logout">退出登录</button></div></details></div></header>
    <div class="content"><div class="page-title"><div><h1 id="heading">全部网址</h1></div><div class="title-actions"><span id="total-count" class="total-count"></span></div></div>
    <form id="search-form" class="search-wrap" role="search"><span class="search-symbol" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索导航或百度" aria-label="搜索关键词" autocomplete="off" maxlength="500" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions"><kbd>/</kbd><button type="submit" class="search-submit">搜索</button><div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="搜索方式" hidden><button type="button" id="search-local-option" role="option" data-search-choice="local" aria-selected="true"><span class="search-source source-local" aria-hidden="true">▦</span><span id="search-local-label">导航中查找</span></button><button type="button" id="search-web-option" role="option" data-search-choice="web" aria-selected="false"><span class="search-source source-web" aria-hidden="true">百</span><span id="search-web-label">百度搜索</span><span class="search-external" aria-hidden="true">↗</span></button></div></form>
    <div class="filters"><div class="org-tabs" id="org-tabs" aria-label="归属"><button class="active" data-org="">全部</button><button data-org="个人">个人</button><button data-org="工作">工作</button><button data-org="其他">其他</button></div><div class="select-filters"><select id="network-filter" aria-label="访问范围"><option value="">全部网络</option><option value="public">公网</option><option value="lan">内网</option></select><select id="env-filter" aria-label="运行环境"><option value="">全部环境</option><option value="production">生产</option><option value="test">测试</option><option value="none">普通网站</option></select></div></div>
    <div id="load-error" class="load-error" role="alert" hidden><span></span><button id="retry-load">重试</button></div><div id="sections" aria-live="polite"></div><footer><span>导航呀</span><a id="background-credit" target="_blank" rel="noopener noreferrer" hidden></a><span id="footer-count"></span></footer></div>
  </main>
</div>
<dialog id="link-dialog"><form id="link-form"><div class="dialog-heading"><h2 id="link-title">添加网址</h2><button type="button" class="icon-btn close-dialog" aria-label="关闭">×</button></div><label>名称<input name="name" required maxlength="120" placeholder="网站或应用名称"></label><label>网址<input name="url" required type="url" maxlength="2048" placeholder="https://" inputmode="url"></label><label>分类<select name="category" required></select></label><label>说明<input name="description" maxlength="500" placeholder="选填"></label><div class="form-row"><label>归属<select name="organization"><option>其他</option><option>个人</option><option>工作</option></select></label><label>网络<select name="network"><option value="public">公网</option><option value="lan">内网</option></select></label><label>环境<select name="environment"><option value="none">普通网站</option><option value="production">生产</option><option value="test">测试</option></select></label></div><div class="form-row"><label>图标<input name="icon" maxlength="16" placeholder="文字或表情"></label><label>排序<input name="sort_order" type="number" min="-1000000" max="1000000" value="0" required></label><label class="check"><input name="pinned" type="checkbox">置顶</label></div><details class="advanced"><summary>固定标识</summary><label><input name="key" maxlength="128" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}" placeholder="留空自动生成" aria-label="固定标识"></label></details><p class="error form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="close-dialog">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="categories-dialog"><div class="dialog-heading"><h2>管理分类</h2><button class="icon-btn close-dialog" aria-label="关闭">×</button></div><div id="category-list"></div><form id="category-form" class="inline-form"><input name="name" placeholder="新分类名称" aria-label="新分类名称" required maxlength="80"><button class="primary">添加</button></form><p class="error form-error" role="alert"></p></dialog>
<dialog id="batch-dialog" class="batch-dialog">
  <form id="batch-form">
    <div class="dialog-heading"><h2>批量编辑 <small id="batch-category"></small></h2><button type="button" class="icon-btn close-dialog" aria-label="关闭">×</button></div>
    <div class="batch-toolbar">
      <label class="batch-select-all"><input type="checkbox" id="batch-select-all">全选</label><span id="batch-selected-count">已选 0</span>
      <select id="batch-operation" aria-label="批量操作"><option value="">选择操作</option><option value="move">移动分类</option><option value="pin">置顶</option><option value="unpin">取消置顶</option><option value="delete">删除</option></select>
      <select id="batch-target" aria-label="目标分类" hidden></select><button type="button" id="batch-apply" disabled>应用</button>
    </div>
    <div class="batch-columns" aria-hidden="true"><span></span><span>名称</span><span>网址</span><span>说明</span></div>
    <div id="batch-list"></div>
    <p class="error form-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" class="close-dialog">关闭</button><button type="submit" class="primary" id="batch-save" disabled>保存修改</button></div>
  </form>
</dialog>
<dialog id="confirm-dialog"><form id="confirm-form"><div class="dialog-heading"><h2 id="confirm-title"></h2><button type="button" class="icon-btn close-dialog" aria-label="关闭">×</button></div><p id="confirm-text"></p><label id="move-label" hidden>目标分类<select id="move-target"></select></label><p class="error form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="close-dialog">取消</button><button type="submit" id="confirm-submit" class="primary">确认</button></div></form></dialog>

<input id="import-file" type="file" accept="application/json,.json" hidden><div id="toast" role="status" hidden></div>
</body></html>
